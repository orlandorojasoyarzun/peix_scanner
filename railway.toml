# Railway service configuration.
#
# This file declares how Railway runs *this* service. There is NO
# `[build]` section: Railway auto-detects Railpack, which respects
# `packageManager` in package.json (we use pnpm, not npm). Forcing
# `builder = "NIXPACKS"` was wrong for this repo — Nixpacks' PHP
# buildplan runs `npm ci` and fails because we use pnpm.
#
# There is also NO `startCommand`: we let Railpack run its PHP/Laravel
# default (FrankenPHP via Caddy + php_server). Overriding it to
# `php artisan serve` was the original sin — artisan serve is
# single-threaded and slow on every cold request (~250-500ms of bootstrap
# before Laravel even runs the route handler), so the Railway
# healthcheck retries beat it to the wire and the deploy fails with
# "1/1 replicas never became healthy" even though /up eventually
# responds 200.
#
# FrankenPHP is multi-threaded and preloaded, so /up responds in <10ms
# after boot. It also already runs `php artisan migrate --force`,
# `php artisan storage:link`, `php artisan optimize` for us — that's
# why we have no `releaseCommand` here either.
#
# `healthcheckPath` must point to a route that returns 2xx once the app
# is fully booted (DB reachable, caches warm). Laravel exposes `/up`
# for exactly this purpose — see bootstrap/app.php's `health: '/up'`.

[deploy]
healthcheckPath = "/up"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
